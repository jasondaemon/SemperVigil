server {
    listen       8080;
    server_name  _;

    root /usr/share/nginx/html/current;
    index index.html;

    location ^~ /vendor/ {
        rewrite ^/vendor/([^/]+)/?$ /entities/?search=$1 permanent;
    }

    location ^~ /product/ {
        rewrite ^/product/([^/]+)/?$ /entities/?search=$1 permanent;
    }

    location ^~ /threat/ {
        rewrite ^/threat/([^/]+)/?$ /entities/?search=$1 permanent;
    }

    location = /vendor/ { return 301 /entities/; }
    location = /product/ { return 301 /entities/; }
    location = /threat/ { return 301 /entities/; }
    location = /vendors/ { return 301 /entities/; }
    location = /products/ { return 301 /entities/; }
    location = /threats/ { return 301 /entities/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
