services:
  # 0) PostgreSQL (internal)
  db:
    image: postgres:16
    container_name: sempervigil-db
    environment:
      POSTGRES_DB: ${SV_DB_NAME:-sempervigil}
      POSTGRES_USER: ${SV_DB_USER:-sempervigil}
      POSTGRES_PASSWORD: ${SV_DB_PASSWORD:-sempervigil}
    volumes:
      - sempervigil_pgdata:/var/lib/postgresql/data
    networks:
      - svnet
    restart: unless-stopped

  # 1) Admin API (internal)
  admin:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    container_name: sempervigil-admin
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_FILE: /data/logs/admin.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_ADMIN_TOKEN: ${SV_ADMIN_TOKEN:-}
      SV_DB_URL: ${SV_DB_URL:-}
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        uvicorn sempervigil.admin:app --host 0.0.0.0 --port 8000
    ports:
      - "0.0.0.0:${SV_ADMIN_PORT:-8001}:8000"
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ./tools:/tools:ro
    networks:
      - svnet
    restart: unless-stopped

  # 2) Workers (internal)
  # Recommended scaling: worker_fetch=2, worker_llm=1
  worker_fetch:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    # NOTE: no container_name so we can scale this service
    depends_on:
      - vpn
      - db
    labels:
      com.sempervigil.role: "worker"
      com.sempervigil.queue: "fetch"
      com.sempervigil.service: "worker_fetch"
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_FILE: /data/logs/worker.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      HTTP_PROXY:  http://vpn:8888
      HTTPS_PROXY: http://vpn:8888
      # ✅ critical: keep internal services direct (no proxy)
      NO_PROXY: db,admin,web,searxng,localhost,127.0.0.1
      SV_WORKER_ONLY_TYPES: "ingest_due_sources,ingest_source,fetch_article_content,cve_sync,build_daily_summary,derive_events_from_articles,enrich_event_from_web,promote_event_web_source_to_article,article_products_backfill,rebuild_vendor_products,source_acquire"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        sempervigil-worker
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - svnet
    restart: unless-stopped
  vpn:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 127.0.0.11
    dns_search: []
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=${PIA_REGION:-us_east}
      # Optional hardening:
      - FIREWALL=on
      - DOT=off
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      # ✅ enable the HTTP proxy (8888)
      - HTTPPROXY=on
      # optional, but helpful:
      - HTTPPROXY_LOG=on
    volumes:
      - ./data/gluetun:/gluetun
    networks:
      - svnet
    restart: unless-stopped
    
  worker_llm:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    # NOTE: no container_name so we can scale this service
    hostname: worker-llm
    labels:
      com.sempervigil.role: "worker"
      com.sempervigil.queue: "llm"
      com.sempervigil.service: "worker_llm"
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_FILE: /data/logs/worker.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      SV_WORKER_ONLY_TYPES: "summarize_article_llm,enrich_event_summary_llm,cve_enrich_llm,article_enrich_products,article_enrich_threat_actors,cve_enrich_threat_actors,article_threat_actors_backfill,cve_threat_actors_backfill"
      SV_LLM_MAX_INFLIGHT: "1"
      SV_WORKER_CONCURRENCY: "1"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        sempervigil-worker
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - svnet
    restart: unless-stopped

  # 3) Builder (on-demand Hugo build)
  builder:
    profiles:
      - build
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    env_file:
      - .env
    environment:
      SV_UMASK: ${SV_UMASK:-002}
      SV_DATA_DIR: /data
      SV_LOG_FILE: /data/logs/builder.log
      SV_HUGO_BASEURL: ${SV_HUGO_BASEURL:-http://localhost:${SV_WEB_PORT:-8080}/}
      SV_HUGO_CACHE_DIR: /data/hugo_cache
      SV_HUGO_MODULES_DIR: /data/hugo_modules
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
    working_dir: /repo
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - .:/repo:ro
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/site
      - ./tools:/tools:ro
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src /venv/bin/python -m sempervigil.builder --once
    networks:
      - svnet
    restart: "no"

  # 3b) Builder scheduler (always-on, claims build_site jobs)
  builder_scheduler:
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    env_file:
      - .env
    environment:
      SV_UMASK: ${SV_UMASK:-002}
      SV_DATA_DIR: /data
      SV_LOG_FILE: /data/logs/builder.log
      SV_HUGO_BASEURL: ${SV_HUGO_BASEURL:-http://localhost:${SV_WEB_PORT:-8080}/}
      SV_HUGO_CACHE_DIR: /data/hugo_cache
      SV_HUGO_MODULES_DIR: /data/hugo_modules
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_BUILDER_POLL_SECONDS: ${SV_BUILDER_POLL_SECONDS:-60}
    working_dir: /repo
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - .:/repo:ro
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/site
      - ./tools:/tools:ro
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src /venv/bin/python -m sempervigil.builder --sleep ${SV_BUILDER_POLL_SECONDS:-10}
    networks:
      - svnet
    restart: unless-stopped

  # 4) Static site server (public)
  web:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: sempervigil-web
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    ports:
      - "${SV_WEB_PORT:-8080}:8080"
    volumes:
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/usr/share/nginx/html:ro
    networks:
      - svnet
    restart: unless-stopped

  # 4) SearXNG (internal web search for enrichment; optional)

  searxng:
    image: searxng/searxng:latest
    profiles: [search]
    environment:
      BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
    volumes:
      - ${SV_SEARXNG_DATA_DIR:-./searxng}:/etc/searxng
    networks: [svnet]
    restart: unless-stopped

  # 5) Test runner (image-only, no NFS)
  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
      args:
        INSTALL_TEST_DEPS: "1"
    env_file:
      - .env
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
    working_dir: /app
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"

volumes:
  sempervigil_pgdata:

networks:
  svnet:
    driver: bridge
