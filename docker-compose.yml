services:
  # 0) PostgreSQL (internal)
  db:
    image: postgres:16
    container_name: sempervigil-db
    environment:
      POSTGRES_DB: ${SV_DB_NAME:-sempervigil}
      POSTGRES_USER: ${SV_DB_USER:-sempervigil}
      POSTGRES_PASSWORD: ${SV_DB_PASSWORD:-sempervigil}
    volumes:
      - sempervigil_pgdata:/var/lib/postgresql/data
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  # 1) Admin API (internal)
  admin:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    container_name: sempervigil-admin
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/admin.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_ADMIN_TOKEN: ${SV_ADMIN_TOKEN:-}
      SV_DB_URL: ${SV_DB_URL:-}
      SV_SCHEDULER_ENABLED: "0"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        uvicorn sempervigil.admin:app --host 0.0.0.0 --port 8000
    ports:
      - "0.0.0.0:${SV_ADMIN_PORT:-8001}:8000"
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ./tools:/tools:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    container_name: sempervigil-orchestrator
    depends_on:
      - db
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/orchestrator.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      SV_ORCH_TICK_SECONDS: ${SV_ORCH_TICK_SECONDS:-30}
      SV_ORCH_LEASE_SECONDS: ${SV_ORCH_LEASE_SECONDS:-120}
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src python -m sempervigil.orchestrator --sleep ${SV_ORCH_TICK_SECONDS:-30}
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  # 2) Stage runners (internal)
  # The orchestrator enqueues launch jobs; each runner performs bounded worker drains.
  worker_fetch:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    # NOTE: no container_name so we can scale this service
    depends_on:
      - vpn
      - db
    labels:
      com.sempervigil.role: "worker"
      com.sempervigil.queue: "fetch"
      com.sempervigil.service: "worker_fetch"
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/worker_fetch.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      HTTP_PROXY:  http://vpn:8888
      HTTPS_PROXY: http://vpn:8888
      # ✅ critical: keep internal services direct (no proxy)
      NO_PROXY: db,admin,web,searxng,localhost,127.0.0.1
      SV_WORKER_QUEUE: "fetch"
      SV_WORKER_SCHEDULER_HOOKS_ENABLED: "0"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src python -m sempervigil.runner --runner fetch --sleep ${SV_RUNNER_POLL_SECONDS:-5}
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped
    
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: sempervigil-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 127.0.0.11
    dns_search: []
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=${PIA_REGION:-us_east}
      # Optional hardening:
      - FIREWALL=on
      - DOT=off
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12
      # ✅ enable the HTTP proxy (8888)
      - HTTPPROXY=on
      # optional, but helpful:
      - HTTPPROXY_LOG=on
    volumes:
      - ./data/gluetun:/gluetun
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped
    
  worker_llm:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    # NOTE: no container_name so we can scale this service
    hostname: worker-llm
    labels:
      com.sempervigil.role: "worker"
      com.sempervigil.queue: "llm"
      com.sempervigil.service: "worker_llm"
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/worker_llm.log
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      SV_WORKER_QUEUE: "llm_local"
      SV_WORKER_SCHEDULER_HOOKS_ENABLED: "0"
      SV_DAILY_BRIEF_MODE: "single"
      SV_LLM_MAX_INFLIGHT: "1"
      SV_WORKER_CONCURRENCY: "1"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src python -m sempervigil.runner --runner llm_local --sleep ${SV_RUNNER_POLL_SECONDS:-5}
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  worker_openai:
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
    hostname: worker-openai
    labels:
      com.sempervigil.role: "worker"
      com.sempervigil.queue: "llm"
      com.sempervigil.service: "worker_openai"
    env_file:
      - .env
    environment:
      SV_ENV: ${SV_ENV:-dev}
      SV_DATA_DIR: /data
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_FIX_SITE_PERMS: "0"
      SV_LOG_LEVEL: ${SV_LOG_LEVEL:-INFO}
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/worker_openai.log
      SV_LLM_LOG_HTTP: "1"
      SV_UMASK: ${SV_UMASK:-002}
      SV_DB_URL: ${SV_DB_URL:-}
      SV_WORKER_QUEUE: "openai"
      SV_WORKER_SCHEDULER_HOOKS_ENABLED: "0"
      SV_DAILY_BRIEF_MODE: "single"
      SV_LLM_MAX_INFLIGHT: "1"
      SV_WORKER_CONCURRENCY: "1"
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src python -m sempervigil.runner --runner openai --sleep ${SV_RUNNER_POLL_SECONDS:-5}
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ./tools:/tools:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  # 3) Builder (on-demand Hugo build)
  builder:
    profiles:
      - build
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    env_file:
      - .env
    environment:
      SV_UMASK: ${SV_UMASK:-002}
      SV_DATA_DIR: /data
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/builder.log
      SV_HUGO_BASEURL: ${SV_HUGO_BASEURL:-https://cybernews.jasondaemon.net/}
      SV_HUGO_CACHE_DIR: /data/hugo_cache
      SV_HUGO_MODULES_DIR: /data/hugo_modules
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
    working_dir: /repo
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - .:/repo:ro
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/site
      - ./tools:/tools:ro
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src /venv/bin/python -m sempervigil.builder --once
    networks:
      - nginx-proxy-manager_default
    restart: "no"

  # 3b) Build runner (orchestrator-directed, executes admitted build work)
  build_worker:
    build:
      context: .
      dockerfile: docker/builder/Dockerfile
    env_file:
      - .env
    environment:
      SV_UMASK: ${SV_UMASK:-002}
      SV_DATA_DIR: /data
      SV_LOG_DIR: /log
      SV_LOG_FILE: /log/builder.log
      SV_HUGO_BASEURL: ${SV_HUGO_BASEURL:-https://cybernews.jasondaemon.net/}
      SV_HUGO_CACHE_DIR: /data/hugo_cache
      SV_HUGO_MODULES_DIR: /data/hugo_modules
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"
      SV_HUGO_SOURCE_DIR: /site-src
      SV_HUGO_OUTPUT_DIR: /site
      SV_BUILDER_POLL_SECONDS: ${SV_BUILDER_POLL_SECONDS:-60}
      SV_BUILDER_LEASE_SECONDS: ${SV_BUILDER_LEASE_SECONDS:-3600}
    working_dir: /repo
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - .:/repo:ro
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_LOG_DIR:-./log}:/log
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/site
      - ./tools:/tools:ro
    command:
      - sh
      - -lc
      - |
        set -e
        umask ${SV_UMASK:-002}
        sh /tools/ensure-dirs.sh
        PYTHONPATH=/app/src /venv/bin/python -m sempervigil.runner --runner build --sleep ${SV_RUNNER_POLL_SECONDS:-5}
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  # 4) Static site server (public)
  web:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: sempervigil-web
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    ports:
      - "${SV_WEB_PORT:-8080}:8080"
    volumes:
      - ${SV_SITE_PUBLIC_DIR:-./site-public}:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nginx-proxy-manager_default
    restart: unless-stopped

  # 4) SearXNG (internal web search for enrichment; optional)

  searxng:
    image: searxng/searxng:latest
    profiles: [search]
    environment:
      BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080/}
    volumes:
      - ${SV_SEARXNG_DATA_DIR:-./searxng}:/etc/searxng
    networks: [nginx-proxy-manager_default]
    restart: unless-stopped

  # 5) Test runner (image-only, no NFS)
  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: docker/ingest/Dockerfile
      args:
        INSTALL_TEST_DEPS: "1"
    env_file:
      - .env
    user: "${SV_UID:-1000}:${SV_GID:-1000}"
    volumes:
      - ${SV_DATA_DIR:-./data}:/data
      - ${SV_SITE_SRC_DIR:-./site-src}:/site-src
    working_dir: /app
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      SV_DB_URL: ${SV_DB_URL:-}
      SV_FIX_SITE_PERMS: "0"

volumes:
  sempervigil_pgdata:

networks:
  nginx-proxy-manager_default:
    external: true
    name: nginx-proxy-manager_default
