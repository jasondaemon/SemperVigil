{% set nav_active = "content" %}
{% set nav_subactive = "events" %}
{% extends "admin/base.html" %}

{% block content %}
<section class="page">
  <div class="page-header">
    <h1>Events</h1>
    <div class="actions">
      <button class="btn" id="events-create">Create Event</button>
      <button class="btn secondary" id="events-derive">Derive Events</button>
      <button class="btn secondary" id="events-normalize">Normalize CVE Keys</button>
      <button class="btn secondary" id="events-rebuild">Rebuild Events</button>
      <button class="btn danger" id="events-purge">Purge Events</button>
    </div>
  </div>
  <form class="filters" id="events-filters">
    <input type="text" id="events-query" placeholder="Search title/summary">
    <select id="events-kind">
      <option value="">All kinds</option>
      <option value="cve_cluster">CVE cluster</option>
      <option value="product_cluster">Product cluster</option>
      <option value="manual">Manual</option>
    </select>
    <select id="events-severity">
      <option value="">All severities</option>
      <option value="CRITICAL">Critical</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
      <option value="UNKNOWN">Unknown</option>
    </select>
    <select id="events-status">
      <option value="">All status</option>
      <option value="open">Open</option>
      <option value="closed">Closed</option>
    </select>
    <label class="checkbox"><input type="checkbox" id="events-include-legacy"> Include legacy</label>
    <input type="date" id="events-after">
    <input type="date" id="events-before">
    <button class="btn" type="submit">Apply</button>
  </form>
  <div class="panel inline">
    <div class="filters inline">
      <label class="checkbox"><input type="checkbox" id="events-purge-dry" checked> Dry run</label>
      <label>Mode
        <select id="events-purge-mode">
          <option value="suppress" selected>Suppress</option>
          <option value="delete">Delete</option>
        </select>
      </label>
      <label>Older than days
        <input type="number" id="events-purge-older" value="30" min="0">
      </label>
      <label class="checkbox"><input type="checkbox" id="events-purge-no-victims"> No victims/entity</label>
      <label class="checkbox"><input type="checkbox" id="events-purge-no-cves"> No CVEs</label>
      <label class="checkbox"><input type="checkbox" id="events-purge-no-sources"> No sources</label>
      <label class="checkbox"><input type="checkbox" id="events-purge-research"> Survey/Research</label>
      <label>Confidence below
        <input type="number" step="0.1" min="0" max="1" id="events-purge-confidence" placeholder="0.5">
      </label>
      <label class="checkbox"><input type="checkbox" id="events-purge-cve-only"> CVE clusters only</label>
      <label class="checkbox"><input type="checkbox" id="events-purge-empty-only"> Only empty CVE clusters</label>
      <button class="btn secondary" type="button" id="events-purge-preview">Preview</button>
    </div>
  </div>
  <div id="events-error" class="error-banner" style="display:none;"></div>
  <table class="table-compact" id="events-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Kind</th>
        <th>Severity</th>
        <th>Status</th>
        <th>Candidate</th>
        <th>Confidence</th>
        <th>Entity</th>
        <th>Incident</th>
        <th>When</th>
        <th>Articles</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="events-pager" class="pager"></div>
</section>

  <div class="modal" id="event-create-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Event</h3>
        <button class="btn small secondary" type="button" id="event-create-close">Close</button>
      </div>
      <div class="grid">
        <label>Title<input type="text" id="event-create-title"></label>
        <label>Kind
          <select id="event-create-kind">
            <option value="breach">breach</option>
            <option value="ransomware">ransomware</option>
            <option value="campaign">campaign</option>
            <option value="exploit_in_the_wild">exploit_in_the_wild</option>
            <option value="advisory">advisory</option>
            <option value="vuln_disclosure">vuln_disclosure</option>
            <option value="other" selected>other</option>
          </select>
        </label>
        <label>Incident Date<input type="date" id="event-create-date"></label>
        <label>Entity<input type="text" id="event-create-entity"></label>
        <label>Confidence Tier
          <select id="event-create-tier">
            <option value="watch" selected>watch</option>
            <option value="likely">likely</option>
            <option value="confirmed">confirmed</option>
          </select>
        </label>
        <label>Confidence (0–1)<input type="number" step="0.01" min="0" max="1" id="event-create-confidence"></label>
        <label>Summary<textarea id="event-create-summary" rows="4"></textarea></label>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="event-create-save">Create</button>
      </div>
    </div>
  </div>


  <div class="modal" id="event-edit-modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Event</h3>
        <button class="btn small secondary" type="button" id="event-edit-close">Close</button>
      </div>
      <input type="hidden" id="event-edit-id">
      <div class="grid">
        <label>Title<input type="text" id="event-edit-title"></label>
        <label>Kind
          <select id="event-edit-kind">
            <option value="breach">breach</option>
            <option value="ransomware">ransomware</option>
            <option value="campaign">campaign</option>
            <option value="exploit_in_the_wild">exploit_in_the_wild</option>
            <option value="advisory">advisory</option>
            <option value="vuln_disclosure">vuln_disclosure</option>
            <option value="other" selected>other</option>
          </select>
        </label>
        <label>Status
          <select id="event-edit-status">
            <option value="open">open</option>
            <option value="closed">closed</option>
          </select>
        </label>
        <label>Severity
          <select id="event-edit-severity">
            <option value="UNKNOWN">UNKNOWN</option>
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
            <option value="CRITICAL">CRITICAL</option>
          </select>
        </label>
        <label>Incident Date<input type="date" id="event-edit-date"></label>
        <label>Entity<input type="text" id="event-edit-entity"></label>
        <label>Confidence Tier
          <select id="event-edit-tier">
            <option value="watch">watch</option>
            <option value="likely">likely</option>
            <option value="confirmed">confirmed</option>
          </select>
        </label>
        <label>Confidence (0–1)<input type="number" step="0.01" min="0" max="1" id="event-edit-confidence"></label>
        <label>Candidate
          <select id="event-edit-candidate">
            <option value="">(unchanged)</option>
            <option value="true">true</option>
            <option value="false">false</option>
          </select>
        </label>
        <label>Summary<textarea id="event-edit-summary" rows="4"></textarea></label>
        <label>Tags (comma separated)<input type="text" id="event-edit-tags"></label>
        <label class="checkbox"><input type="checkbox" id="event-edit-is-event" checked> Is event</label>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="event-edit-save">Save</button>
        <button class="btn danger" type="button" id="event-edit-delete">Delete</button>
      </div>
    </div>
  </div>

{% endblock %}
