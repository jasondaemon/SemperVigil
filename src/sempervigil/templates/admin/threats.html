{% extends "admin/base.html" %}
{% set nav_active = "content" %}
{% set nav_subactive = "threats" %}
{% block content %}
  <section class="panel">
    <h2>Threat Actors</h2>
    <div class="actions">
      <label class="inline-select">Limit
        <select id="threats-backfill-limit">
          <option value="50">50</option>
          <option value="200" selected>200</option>
          <option value="500">500</option>
        </select>
      </label>
      <button class="btn small secondary" id="threats-backfill-articles">Backfill Article Threats</button>
      <button class="btn small secondary" id="threats-backfill-cves">Backfill CVE Threats</button>
    </div>
    <form id="threats-search-form" class="filters">
      <input type="text" id="threats-query" placeholder="Search threat actor">
      <select id="threats-page-size">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="error" id="threats-error" style="display:none;"></p>
  </section>

  <section class="panel">
    <table id="threats-table" class="table-compact">
      <thead>
        <tr>
          <th>Actor</th>
          <th>Type</th>
          <th>Aliases</th>
          <th>Articles</th>
          <th>CVEs</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="pager" id="threats-pager"></div>
  </section>
{% endblock %}
