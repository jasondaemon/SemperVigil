{{ $articles := site.Data.articles.recent }}
{{ if not $articles }}
  <main class="home">
    <h1>SemperVigil</h1>
    <p>No recent articles yet.</p>
  </main>
{{ else }}
  <main class="home">
    <h1>SemperVigil</h1>
    <div class="article-list">
      {{ range $articles }}
        <article class="article-row">
          <a class="article-title" href="{{ .url }}" target="_blank" rel="noopener">{{ .title }}</a>
          <div class="article-meta">
            <span class="article-source">{{ .source }}</span>
            <span class="article-date">{{ .published_at_human }}</span>
            {{ with .tags }}<span class="article-tags">{{ delimit . ", " }}</span>{{ end }}
          </div>
        </article>
      {{ end }}
    </div>
  </main>
{{ end }}
