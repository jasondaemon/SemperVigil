{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sempervigil.componentFullname" (list . "orchestrator") }}
  labels:
    {{- include "sempervigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "sempervigil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "sempervigil.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: {{ include "sempervigil.serviceAccountName" . }}
      containers:
        - name: sempervigil-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh","-lc"]
          args:
            - >-
              set -e;
              umask {{ .Values.env.SV_UMASK | quote }};
              sh /app/tools/ensure-dirs.sh;
              PYTHONPATH=/app/src python -m sempervigil.orchestrator --sleep {{ .Values.orchestrator.tickSeconds | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "sempervigil.fullname" . }}-env
          env:
            - name: SV_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sempervigil.secretName" .) .Values.externalDatabase.existingSecret }}
                  key: {{ default "url" .Values.externalDatabase.urlKey }}
            - name: SV_ORCH_TICK_SECONDS
              value: {{ .Values.orchestrator.tickSeconds | quote }}
            - name: SV_ORCH_LEASE_SECONDS
              value: {{ .Values.orchestrator.leaseSeconds | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /log
            {{- if .Values.storage.tools.enabled }}
            - name: tools
              mountPath: /tools
              readOnly: true
            {{- end }}
            - name: site-src
              mountPath: /site-src
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.data "data") }}
        - name: logs
          {{- include "sempervigil.logsVolume" . | nindent 10 }}
        {{- if .Values.storage.tools.enabled }}
        - name: tools
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.tools "tools") }}
        {{- end }}
        - name: site-src
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.siteSrc "siteSrc") }}
{{- end }}
