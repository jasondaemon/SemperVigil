{{- if .Values.workerOpenai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sempervigil.componentFullname" (list . "worker-openai") }}
  labels:
    {{- include "sempervigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-openai
spec:
  replicas: {{ .Values.workerOpenai.replicaCount }}
  selector:
    matchLabels:
      {{- include "sempervigil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-openai
  template:
    metadata:
      labels:
        {{- include "sempervigil.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-openai
    spec:
      serviceAccountName: {{ include "sempervigil.serviceAccountName" . }}
      containers:
        - name: {{ include "sempervigil.componentFullname" (list . "worker-openai") }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh","-lc"]
          args:
            - >-
              set -e;
              umask {{ .Values.env.SV_UMASK | quote }};
              sh /app/tools/ensure-dirs.sh;
              sempervigil-worker
          envFrom:
            - configMapRef:
                name: {{ include "sempervigil.fullname" . }}-env
          env:
            - name: SV_LOG_FILE
              value: /log/worker_openai.log
            - name: SV_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "sempervigil.secretName" .) .Values.externalDatabase.existingSecret }}
                  key: {{ default "url" .Values.externalDatabase.urlKey }}
            - name: SV_WORKER_PROVIDER_SCOPE
              value: "openai"
            - name: SV_WORKER_QUEUE
              value: "openai"
            - name: SV_WORKER_SCHEDULER_HOOKS_ENABLED
              value: "0"
            - name: SV_DAILY_BRIEF_MODE
              value: "single"
            - name: SV_LLM_MAX_INFLIGHT
              value: "1"
            - name: SV_WORKER_CONCURRENCY
              value: "1"
            - name: SV_LLM_LOG_HTTP
              value: "1"
            - name: SV_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sempervigil.appSecretName" . }}
                  key: SV_LLM_API_KEY
            - name: SEMPERVIGIL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sempervigil.appSecretName" . }}
                  key: SEMPERVIGIL_MASTER_KEY
            - name: SEMPERVIGIL_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "sempervigil.appSecretName" . }}
                  key: SEMPERVIGIL_KEY_ID
            - name: NVD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sempervigil.appSecretName" . }}
                  key: NVD_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /log
            {{- if .Values.storage.tools.enabled }}
            - name: tools
              mountPath: /tools
              readOnly: true
            {{- end }}
            - name: site-src
              mountPath: /site-src
          resources:
            {{- toYaml .Values.workerOpenai.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.data "data") }}
        - name: logs
          {{- include "sempervigil.logsVolume" . | nindent 10 }}
        {{- if .Values.storage.tools.enabled }}
        - name: tools
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.tools "tools") }}
        {{- end }}
        - name: site-src
          persistentVolumeClaim:
            claimName: {{ include "sempervigil.storageClaimName" (list . .Values.storage.siteSrc "siteSrc") }}
{{- end }}
