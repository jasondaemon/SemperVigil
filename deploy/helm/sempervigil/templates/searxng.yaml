{{- if .Values.searxng.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sempervigil.componentFullname" (list . "searxng") }}
  labels:
    {{- include "sempervigil.labels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
spec:
  replicas: {{ .Values.searxng.replicaCount }}
  selector:
    matchLabels:
      {{- include "sempervigil.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: searxng
  template:
    metadata:
      annotations:
        checksum/searxng-config: {{ include (print $.Template.BasePath "/searxng-config.yaml") . | sha256sum }}
      labels:
        {{- include "sempervigil.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: searxng
    spec:
      serviceAccountName: {{ include "sempervigil.serviceAccountName" . }}
      initContainers:
        - name: configure-searxng
          image: searxng/searxng:latest
          command:
            - /bin/sh
            - -ec
            - |
              cp /config-template/settings.yml /config/settings.yml
              sed -i "s/ultrasecretkey/$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')/g" /config/settings.yml
              chown -R searxng:searxng /config
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: sempervigil-searxng
          image: searxng/searxng:latest
          env:
            - name: BASE_URL
              value: http://sempervigil-searxng:8080/
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
      volumes:
        - name: config-template
          configMap:
            name: {{ include "sempervigil.componentFullname" (list . "searxng-config") }}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sempervigil.componentFullname" (list . "searxng") }}
  labels:
    {{- include "sempervigil.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sempervigil.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
